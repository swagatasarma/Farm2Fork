{% extends "base.html" %} {% block content %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Transaction Records</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body class="p-4">
    <div class="container">
      <h2>Transaction Records</h2>
      <form id="addTxnForm" class="mb-4">
        <div class="row">
          <div class="col-md-2">
            <input
              type="text"
              id="buyer"
              class="form-control"
              placeholder="Buyer"
              required
            />
          </div>
          <div class="col-md-2">
            <input
              type="text"
              id="seller"
              class="form-control"
              placeholder="Seller"
              required
            />
          </div>
          <div class="col-md-2">
            <input
              type="text"
              id="product"
              class="form-control"
              placeholder="Product"
              required
            />
          </div>
          <div class="col-md-2">
            <input
              type="number"
              id="quantity"
              class="form-control"
              placeholder="Qty"
              required
            />
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary w-100" type="submit">Add</button>
          </div>
        </div>
      </form>
      <table class="table table-bordered" id="txnTable">
        <thead>
          <tr>
            <th>Buyer</th>
            <th>Seller</th>
            <th>Product</th>
            <th>Quantity</th>
          </tr>
        </thead>
        <tbody>
          {% for txn in transactions %}
          <tr>
            <td>{{ txn.buyer }}</td>
            <td>{{ txn.seller }}</td>
            <td>{{ txn.product }}</td>
            <td>{{ txn.quantity }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <script>
      $("#addTxnForm").submit(function (e) {
        e.preventDefault();
        const newTxn = {
          buyer: $("#buyer").val(),
          seller: $("#seller").val(),
          product: $("#product").val(),
          quantity: parseInt($("#quantity").val()),
        };
        $.ajax({
          url: "/transactions/api",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify(newTxn),
          success: function (response) {
            $("#txnTable tbody").append(
              `<tr><td>${newTxn.buyer}</td><td>${newTxn.seller}</td><td>${newTxn.product}</td><td>${newTxn.quantity}</td></tr>`
            );
            $("#addTxnForm")[0].reset();
          },
        });
      });
    </script>
  </body>
</html>
{% endblock %}
