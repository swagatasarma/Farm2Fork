{% extends "base.html" %} {% block content %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Real-Time Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body class="p-4">
    <div class="container">
      <h2>Real-Time Inventory Management</h2>
      <form id="addItemForm" class="mb-4">
        <div class="row">
          <div class="col-md-3">
            <input
              type="text"
              id="name"
              class="form-control"
              placeholder="Item Name"
              required
            />
          </div>
          <div class="col-md-3">
            <input
              type="number"
              id="quantity"
              class="form-control"
              placeholder="Quantity"
              required
            />
          </div>
          <div class="col-md-3">
            <input
              type="text"
              id="location"
              class="form-control"
              placeholder="Unit"
              required
            />
          </div>
          <div class="col-md-3">
            <button class="btn btn-success w-100" type="submit">
              Add Item
            </button>
          </div>
        </div>
      </form>
      <table class="table table-bordered" id="inventoryTable">
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Unit</th>
          </tr>
        </thead>
        <tbody>
          {% for item in inventory %}
          <tr>
            <td>{{ item.item }}</td>
            <td>{{ item.quantity }}</td>
            <td>{{ item.unit }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <script>
      $("#addItemForm").submit(function (e) {
        e.preventDefault();
        const newItem = {
          item: $("#name").val(),
          quantity: parseInt($("#quantity").val()),
          unit: $("#location").val(),
        };
        $.ajax({
          url: "/inventory/api",
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify(newItem),
          success: function (response) {
            $("#inventoryTable tbody").append(
              `<tr><td>${newItem.item}</td><td>${newItem.quantity}</td><td>${newItem.unit}</td></tr>`
            );
            $("#addItemForm")[0].reset();
          },
        });
      });
    </script>
  </body>
</html>
{% endblock %}
